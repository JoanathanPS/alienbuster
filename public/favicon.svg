<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="alienGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#15803d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#052e16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>
  
  <!-- Dark Rounded Hexagonal / Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  
  <!-- Central Pulse Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#alienGlow)" />
  
  <!-- Radar Scanner Reticle -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="8 3" opacity="0.85" />
  <circle cx="32" cy="32" r="12" fill="none" stroke="#4ade80" stroke-width="1.4" opacity="0.6" />
  
  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="16" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="48" x2="32" y2="58" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
  <line x1="6" y1="32" x2="16" y2="32" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
  <line x1="48" y1="32" x2="58" y2="32" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
  
  <!-- Bio Bug / Alien Antennae & Mask -->
  <!-- Center Core -->
  <circle cx="32" cy="32" r="5" fill="#4ade80" />
  
  <!-- Top Sensor Horns / Wings -->
  <path d="M 23 23 C 25 15, 30 18, 32 24 C 34 18, 39 15, 41 23" fill="none" stroke="url(#cyberGreen)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Lower Mandibles / Calipers -->
  <path d="M 25 39 C 27 45, 30 43, 32 38 C 34 43, 37 45, 39 39" fill="none" stroke="url(#cyberGreen)" stroke-width="2" stroke-linecap="round" />

  <!-- Targeting Pip -->
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>

